<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>VYNTRO • Profile</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 16px 50px}.top{display:flex;justify-content:space-between}.back{color:#aaa;text-decoration:none}.hero{text-align:center;padding:30px 0 20px}.avatar{width:92px;height:92px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;margin:auto;font-size:34px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.hero h1{margin:14px 0 3px}.muted{color:#888}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat,.ach{border:1px solid #ffffff18;background:#ffffff08;border-radius:20px;padding:16px;text-align:center}.stat b{font-size:24px;display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ach{text-align:left}.ach b{font-size:18px}.ach p{color:#888;font-size:12px;margin:5px 0}.bar{height:8px;background:#ffffff10;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#fff;border-radius:99px}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../">‹ VYNTRO</a><span class="muted">PROFILE</span></div><p style="text-align:center"><a class="back" href="../leaderboard/">🏆 Global Leaderboard</a></p><section class="hero"><div class="avatar" id="avatar">V</div><h1 id="name">Telegram User</h1><div class="muted" id="handle">Connecting…</div></section><div class="stats"><div class="stat"><b id="level">1</b><span class="muted">Level</span></div><div class="stat"><b id="xp">0</b><span class="muted">XP</span></div><div class="stat"><b id="played">0</b><span class="muted">Games</span></div></div><div class="stats"><div class="stat"><b id="wins">0</b><span class="muted">Wins</span></div><div class="stat"><b id="streak">0</b><span class="muted">🔥 Streak</span></div><div class="stat"><b id="achcount">0</b><span class="muted">Achievements</span></div></div><div class="stat"><b>Next Level</b><div class="bar"><div class="fill" id="fill" style="width:10%"></div></div><p class="muted" id="next">0 / 250 XP</p></div><h2>🏆 Achievements</h2><div class="grid" id="achievements"></div></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();async function load(){if(!tg?.initData){document.querySelector("#handle").textContent="Open VYNTRO inside Telegram to sign in.";return}try{const r=await fetch("/api/profile",{headers:{"X-Telegram-Init-Data":tg.initData}});const d=await r.json();if(!d.ok)throw new Error(d.error);const p=d.profile;document.querySelector("#name").textContent=[p.firstName,p.lastName].filter(Boolean).join(" ")||"Telegram User";document.querySelector("#handle").textContent=p.username?"@"+p.username:"Telegram account connected";document.querySelector("#level").textContent=p.level;document.querySelector("#xp").textContent=p.xp;document.querySelector("#played").textContent=p.gamesPlayed;document.querySelector("#wins").textContent=p.wins||0;document.querySelector("#streak").textContent=p.streak||0;document.querySelector("#achcount").textContent=p.achievements.length;document.querySelector("#next").textContent=(p.xp%250)+" / 250 XP";document.querySelector("#fill").style.width=Math.min(100,(p.xp%250)/2.5)+"%";if(p.photoUrl)document.querySelector("#avatar").innerHTML='<img src="'+p.photoUrl+'">';else document.querySelector("#avatar").textContent=(p.firstName||"V").slice(0,1).toUpperCase();const box=document.querySelector("#achievements");Object.entries(d.achievements).forEach(([k,a])=>{const earned=p.achievements.includes(k);box.insertAdjacentHTML("beforeend",'<div class="ach"><b>'+a.icon+" "+a.title+'</b><p>'+a.xp+' XP • '+(earned?'Unlocked ✓':'Locked')+'</p></div>')})}catch(e){document.querySelector("#handle").textContent="⚠️ "+e.message}}load();</script></body></html>
