<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Report Writer • VYNTRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#080808;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #252525;position:sticky;top:0;background:#0c0c0cee;backdrop-filter:blur(18px);z-index:10}
header a{color:#ddd;text-decoration:none;margin-right:18px}
header b{font-size:15px}
header span{margin-left:auto;color:#777;font-size:11px}
.layout{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 58px)}
aside{padding:16px;overflow:auto;max-height:calc(100vh - 58px);border-right:1px solid #222}
label{display:block;color:#aaa;font-size:12px;margin:12px 0}
input,textarea,select{width:100%;margin-top:6px;background:#151515;color:#eee;border:1px solid #333;border-radius:10px;padding:10px;font:inherit}
textarea{resize:vertical}
h2{font-size:14px;margin-top:20px}
.format-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.format-grid label{margin:8px 0}
.format-note{color:#777;font-size:11px;line-height:1.4}
button{width:100%;padding:12px;border:0;border-radius:11px;margin-top:14px;font-weight:700;cursor:pointer}
button.secondary{background:#191919;color:#ddd;border:1px solid #333}
.export-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.export-actions button{margin-top:14px;background:#f1f1f1;color:#111}
.export-actions .docx-btn{background:#191919;color:#eee;border:1px solid #333}
#preview{padding:25px;overflow:auto;background:radial-gradient(circle at 80% 0,#1a1a1a,transparent 35%)}
.preview{width:210mm;height:297mm;box-sizing:border-box;background:#fff;color:#111;margin:0 auto 25px;padding:25mm 22mm 20mm 25mm;position:relative;box-shadow:0 3px 22px #0005;overflow:hidden}
.no{position:absolute;right:18mm;top:12mm;color:#777;opacity:.72;font:11pt "Times New Roman",serif}
.title{text-align:center;padding-top:45mm}
.title h1{font-weight:bold;max-width:150mm;margin:0 auto 18mm;overflow-wrap:break-word}
.meta,.submitted,.section,.p,.ref{font-family:"Times New Roman",serif}
.meta,.submitted{line-height:1.7}
.submitted{margin-top:18mm}
.section{font-weight:bold;margin:0 0 8pt}
.p,.ref{display:block;width:100%;max-width:100%;white-space:normal;overflow-wrap:break-word;word-break:normal}
.p{text-align:justify;text-indent:1.27cm;margin:0 0 10pt}
.p.continuation{text-indent:0}
.ref{text-align:left;margin:0 0 8pt;text-indent:0}
.content-page{padding-top:25mm}
@media(max-width:850px){
.layout{grid-template-columns:1fr}
aside{max-height:none;border:0}
#preview{overflow:auto}
.preview{margin-left:0}
}
@media print{
@page{size:A4 portrait;margin:0}
html,body{background:#fff;width:210mm;margin:0;padding:0}
header,aside{display:none!important}
.layout{display:block;min-height:0}
#preview{padding:0!important;margin:0!important;background:#fff!important;overflow:visible!important}
.preview{width:210mm;height:297mm;margin:0!important;padding:25mm 22mm 20mm 25mm;box-shadow:none;overflow:hidden;page-break-after:always;break-after:page}
.preview:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>
<body>
<header><a href="../../">← VYNTRO</a><b>Report Writer</b><span>Utility</span></header>
<div class="layout">
<aside>
<h2>Report Details</h2>
<label>Report Title<textarea id="title" rows="5" placeholder="Enter your report title..."></textarea></label>
<label>Assessment Type<input id="assessment" placeholder="e.g. SEC – Internal Assessment"></label>
<label>Department<input id="department" placeholder="e.g. Department of English"></label>
<label>University / Institution<input id="university" placeholder="Enter university name..."></label>
<label>Student Name<input id="student" placeholder="Enter your full name..."></label>
<label>Year / Semester<input id="semester" placeholder="e.g. UG 2nd Year – 3rd Semester"></label>
<h2>Heading Alignment</h2>
<select id="align"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
<h2>Text Formatting</h2>
<div class="format-grid">
<label>Font Size<select id="fontSize"><option>10</option><option>11</option><option selected>12</option><option>13</option><option>14</option><option>16</option><option>18</option></select></label>
<label>Line Spacing<select id="lineSpacing"><option>1</option><option>1.15</option><option>1.5</option><option selected>2</option><option>2.2</option><option>2.5</option><option>3</option></select></label>
</div>
<p class="format-note">Paragraphs are separated by blank lines. Each new paragraph gets a first-line indent. Long paragraphs continue naturally onto the next A4 page without repeating words.</p>
<h2>Executive Summary</h2>
<textarea id="summary" rows="14" placeholder="Write your executive summary here..."></textarea>
<h2>Report</h2>
<textarea id="report" rows="20" placeholder="Write your report here..."></textarea>
<h2>References</h2>
<textarea id="refs" rows="12" placeholder="Enter your references here..."></textarea>
<div class="export-actions">
<button id="pdfBtn" onclick="exportPDF()">📄 Export PDF</button>
<button id="docxBtn" class="docx-btn" onclick="exportDOCX()">📝 Export DOCX</button>
</div>
<button class="secondary" onclick="clearAll()">Clear All</button>
</aside>
<main id="preview"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.6.1/build/index.umd.js"></script>
<script>
const $=id=>document.getElementById(id);

function esc(v){
 return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function surname(){
 const p=$("student").value.trim().split(/\s+/);
 return p.length&&p[0]?p[p.length-1]:"";
}

function label(n){
 const s=surname();
 return s?esc(s)+" "+n:String(n);
}

function splitParagraphs(text){
 return String(text||"").replace(/\r/g,"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
}

function makePage(number,extraClass=""){
 const page=document.createElement("section");
 page.className="preview "+extraClass;
 page.innerHTML='<div class="no">'+label(number)+'</div>';
 $("preview").appendChild(page);
 return page;
}

function addHeading(page,title,align,fs){
 const h=document.createElement("h2");
 h.className="section";
 h.style.textAlign=align;
 h.style.fontSize=(fs+2)+"pt";
 h.textContent=title;
 page.appendChild(h);
}

function fits(page){
 return page.scrollHeight <= page.clientHeight + 1;
}

/*
 * Flow one paragraph through A4 pages.
 * The current word is NEVER stored twice: when it starts a new page,
 * the temporary buffer is cleared, so the word cannot be duplicated.
 */
function addParagraphFlow(text,page,ref,fs,ls,nextPageNumber){
 const words=String(text).trim().split(/\s+/).filter(Boolean);
 if(!words.length) return page;

 let currentPage=page;
 let buffer="";
 let firstChunk=true;

 const buildParagraph=(value,continuation)=>{
   const p=document.createElement("p");
   p.className=(ref?"ref":"p")+(continuation?" continuation":"");
   p.style.fontSize=fs+"pt";
   p.style.lineHeight=ls;
   p.textContent=value;
   return p;
 };

 for(const word of words){
   const candidate=buffer?buffer+" "+word:word;
   const test=buildParagraph(candidate,!firstChunk);
   currentPage.appendChild(test);

   if(fits(currentPage)){
     currentPage.removeChild(test);
     buffer=candidate;
     continue;
   }

   currentPage.removeChild(test);

   if(buffer){
     currentPage.appendChild(buildParagraph(buffer,!firstChunk));
     currentPage=makePage(nextPageNumber.value++);
     firstChunk=false;
     buffer=word;
   }else{
     /*
      * No word fits on the current page. This can happen when a heading
      * or a previous element has consumed the available space.
      * Start a fresh page and put the word there exactly once.
      */
     currentPage=makePage(nextPageNumber.value++);
     firstChunk=false;
     buffer=word;
   }
 }

 if(buffer){
   currentPage.appendChild(buildParagraph(buffer,!firstChunk));
 }

 return currentPage;
}

function renderTextSection(title,text,ref,align,fs,ls,pageNumber){
 const paragraphs=splitParagraphs(text);
 if(!paragraphs.length) return;

 let page=makePage(pageNumber.value++,"content-page");
 addHeading(page,title,align,fs);

 for(const paragraph of paragraphs){
   page=addParagraphFlow(paragraph,page,ref,fs,ls,pageNumber);
 }
}

function renderTitle(fs,pageNumber){
 const section=makePage(pageNumber.value++,"title");
 section.innerHTML+='<h1 style="font-size:'+fs+'pt;line-height:1.35">'+esc($("title").value)+'</h1>'+
 '<div class="meta" style="font-size:'+fs+'pt">'+
 esc($("assessment").value)+'<br>'+
 esc($("department").value)+'<br>'+
 esc($("university").value)+
 '</div>'+
 '<div class="submitted" style="font-size:'+fs+'pt">Submitted by<br><b>'+
 esc($("student").value)+'</b><br>'+
 esc($("semester").value)+'</div>';
}

function render(){
 $("preview").innerHTML="";
 const fs=parseFloat($("fontSize").value);
 const ls=parseFloat($("lineSpacing").value);
 const align=$("align").value;
 const pageNumber={value:1};

 renderTitle(fs,pageNumber);
 renderTextSection("Executive Summary",$("summary").value,false,align,fs,ls,pageNumber);
 renderTextSection("Report",$("report").value,false,align,fs,ls,pageNumber);
 renderTextSection("References",$("refs").value,true,align,fs,ls,pageNumber);
}

function clearAll(){
 ["title","assessment","department","university","student","semester","summary","report","refs"].forEach(id=>$(id).value="");
 $("align").value="left";
 $("fontSize").value="12";
 $("lineSpacing").value="2";
 render();
}

["title","assessment","department","university","student","semester","align","fontSize","lineSpacing","summary","report","refs"].forEach(id=>{
 $(id).addEventListener("input",render);
 $(id).addEventListener("change",render);
});

function safeFileName(){
  const raw=$("title").value.trim() || "VYNTRO-Report";
  return raw.replace(/[^a-z0-9]+/gi,"-").replace(/^-+|-+$/g,"").slice(0,80) || "VYNTRO-Report";
}

function exportPayload(type){
  return {
    type,
    title:$("title").value,
    assessment:$("assessment").value,
    department:$("department").value,
    university:$("university").value,
    student:$("student").value,
    semester:$("semester").value,
    align:$("align").value,
    fontSize:$("fontSize").value,
    lineSpacing:$("lineSpacing").value,
    summary:$("summary").value,
    report:$("report").value,
    refs:$("refs").value
  };
}

async function downloadExport(type,buttonId,defaultLabel){
  const b=$(buttonId);
  b.disabled=true;
  b.style.opacity=".65";
  b.textContent="⏳ Generating…";
  try{
    const payload=exportPayload(type);
    if(tg?.initData) payload.telegramInitData=tg.initData;

    const response=await fetch("/api/export",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });

    const contentType=response.headers.get("content-type")||"";
    if(!response.ok){
      let message="Export failed.";
      try{
        const j=await response.json();
        if(j.error) message=j.error;
      }catch(_){}
      throw new Error(message);
    }

    if(contentType.includes("application/json")){
      const result=await response.json();
      if(result.delivered==="telegram"){
        if(tg?.showPopup){
          tg.showPopup({
            title:"Export complete",
            message:(type==="pdf"?"PDF":"DOCX")+" has been sent to your Telegram chat. 📄",
            buttons:[{type:"ok"}]
          });
        }else{
          alert((type==="pdf"?"PDF":"DOCX")+" has been sent to Telegram. 📄");
        }
        return;
      }
      throw new Error(result.error||"The export was generated but could not be delivered.");
    }

    const blob=await response.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=safeFileName()+"."+type;
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  }catch(err){
    console.error("VYNTRO export error:",err);
    const message=(type==="pdf"?"PDF":"DOCX")+" export failed: "+(err.message||"Unknown error");
    if(tg?.showPopup){
      tg.showPopup({title:"Export failed",message,buttons:[{type:"ok"}]});
    }else{
      alert(message);
    }
  }finally{
    b.disabled=false;
    b.style.opacity="1";
    b.textContent=defaultLabel;
  }
}

function exportPDF(){ return downloadExport("pdf","pdfBtn","📄 Export PDF"); }
function exportDOCX(){ return downloadExport("docx","docxBtn","📝 Export DOCX"); }

const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}
render();
</script>
</body>
</html>
