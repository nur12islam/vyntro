<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYNTRO • Would You Rather</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#252525,transparent 38%),#070707;color:#fff;font-family:system-ui,sans-serif;padding:18px}.wrap{max-width:620px;margin:auto}.top{display:flex;justify-content:space-between}.back{color:#aaa;text-decoration:none}.card{margin-top:28px;padding:24px;border:1px solid #ffffff18;border-radius:25px;background:#ffffff08;text-align:center}.q{font-size:24px;font-weight:850;line-height:1.3;margin:20px 0}.choices{display:grid;gap:12px}.choices button,.new{border:1px solid #ffffff18;border-radius:16px;padding:16px;background:#ffffff0b;color:#fff;font-weight:750;font-size:15px}.new{width:100%;margin-top:14px;background:#eee;color:#111}.small{text-align:center;color:#777;font-size:12px;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../../">‹ VYNTRO</a><span>🎯 Party</span></div><section class="card"><div>WOULD YOU RATHER</div><div class="q" id="q"></div><div class="choices"><button id="a"></button><button id="b"></button></div><button class="new" id="next">Next</button></section><div class="small" id="count"></div></main><script>const data=[["Always know when someone is lying","Always know when someone is telling the truth"],["Live without music","Live without movies"],["Have unlimited money","Have unlimited free time"],["Travel to the past","Travel to the future"],["Be famous for a day","Be anonymous forever"],["Always be 10 minutes late","Always be 20 minutes early"]];let i=0;function render(){let x=data[i%data.length];q.textContent=x[0]+" OR "+x[1]+"?";a.textContent="A · "+x[0];b.textContent="B · "+x[1];count.textContent="Prompt "+(i+1)}a.onclick=b.onclick=()=>{i++;render()};next.onclick=()=>{i++;render()};render()</script></body></html>
