<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>VYNTRO • Quiz Arena</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#2a2031,transparent 40%),#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;padding:18px}.wrap{width:min(650px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#aaa;text-decoration:none}.badge{border:1px solid #ffffff18;border-radius:999px;padding:8px 12px;color:#aaa;font-size:12px}.hero{text-align:center;padding:38px 8px 25px}.hero h1{font-size:42px;letter-spacing:-.05em;margin:0 0 8px}.hero p{color:#999;margin:0}.panel{border:1px solid #ffffff18;background:#ffffff08;border-radius:25px;padding:20px;box-shadow:0 25px 80px #0007;backdrop-filter:blur(24px)}label{display:block;color:#999;font-size:12px;margin:0 0 7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input{width:100%;border:1px solid #ffffff18;background:#111;color:#fff;border-radius:13px;padding:12px}button{border:0;border-radius:14px;padding:13px;background:#eee;color:#111;font-weight:800;width:100%;margin-top:12px}.question{font-size:22px;line-height:1.35;font-weight:800;margin:6px 0 18px}.option{background:#ffffff0a;color:#fff;border:1px solid #ffffff14;text-align:left}.option.correct{background:#173d2c}.option.wrong{background:#45232a}.meta{display:flex;justify-content:space-between;color:#888;font-size:12px;margin-bottom:15px}.small{color:#777;font-size:12px;text-align:center;margin-top:10px}.hide{display:none}.score{text-align:center;font-size:42px;font-weight:900;margin:15px}.notice{padding:10px 12px;border-radius:12px;background:#ffffff08;color:#aaa;font-size:12px;margin-top:10px}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../../">‹ VYNTRO</a><span class="badge">⚡ Quiz Arena</span></div><section class="hero"><h1>Quiz Arena</h1><p>AI-generated quizzes powered by your configured provider.</p></section><section class="panel" id="setup"><div class="row"><div><label>Topic</label><input id="topic" value="General Knowledge" maxlength="80"></div><div><label>Difficulty</label><select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div></div><div class="row"><div><label>Questions</label><select id="count"><option>5</option><option selected>10</option><option>15</option></select></div><div><label>Mode</label><select id="mode"><option value="ai" selected>AI Arena</option><option value="demo">Demo Bank</option></select></div></div><button id="start">🚀 Start Quiz</button><div class="notice">Set GROQ_API_KEY or OPENROUTER_API_KEY in Cloudflare Worker secrets to enable AI generation. Keys never reach the browser.</div></section><section class="panel hide" id="quiz"><div class="meta"><span id="qnum"></span><span id="points"></span></div><div class="question" id="question"></div><div id="options"></div><button id="next" class="hide">Next →</button></section><section class="panel hide" id="result"><div class="score" id="final"></div><div id="summary" class="small"></div><button id="again">↻ Play Again</button></section></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let qs=[],at=0,score=0,locked=false;
const demo=[["Which planet is known as the Red Planet?",["Mars","Venus","Jupiter","Mercury"],0],["What is the capital of Japan?",["Kyoto","Tokyo","Osaka","Nagoya"],1],["Which language is primarily used to style web pages?",["HTML","CSS","SQL","JSON"],1],["How many sides does a hexagon have?",["5","6","7","8"],1],["Which gas do plants primarily absorb for photosynthesis?",["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],2]];
function show(id){["setup","quiz","result"].forEach(x=>document.querySelector("#"+x).classList.toggle("hide",x!==id))}
function render(){const q=qs[at];locked=false;document.querySelector("#qnum").textContent="Question "+(at+1)+" / "+qs.length;document.querySelector("#points").textContent="Score "+score;document.querySelector("#question").textContent=q.question;const box=document.querySelector("#options");box.innerHTML=q.options.map((o,i)=>'<button class="option" data-i="'+i+'">'+o+"</button>").join("");box.querySelectorAll("button").forEach(b=>b.onclick=()=>answer(+b.dataset.i));document.querySelector("#next").classList.add("hide")}
function answer(i){if(locked)return;locked=true;const q=qs[at],buttons=[...document.querySelectorAll(".option")];buttons.forEach((b,n)=>{if(n===q.answer)b.classList.add("correct");if(n===i&&i!==q.answer)b.classList.add("wrong")});if(i===q.answer)score+=10;document.querySelector("#points").textContent="Score "+score;document.querySelector("#next").classList.remove("hide")}
function finish(){show("result");document.querySelector("#final").textContent=score+" / "+(qs.length*10);document.querySelector("#summary").textContent="Correct answers: "+(score/10)+" of "+qs.length+" · "+(score===qs.length*10?"Perfect run! 🔥":"Good run — play again and beat it!")}
async function start(){const mode=document.querySelector("#mode").value,topic=document.querySelector("#topic").value.trim()||"General Knowledge",difficulty=document.querySelector("#difficulty").value,count=+document.querySelector("#count").value;document.querySelector("#start").disabled=true;try{if(mode==="demo"){qs=Array.from({length:count},(_,i)=>{const d=demo[i%demo.length];return {question:d[0],options:d[1],answer:d[2]}})}else{const r=await fetch("/api/quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({topic,difficulty,count})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"Quiz generation failed");qs=j.questions}at=0;score=0;show("quiz");render()}catch(e){alert(e.message)}finally{document.querySelector("#start").disabled=false}}
document.querySelector("#start").onclick=start;document.querySelector("#next").onclick=()=>{if(at+1<qs.length){at++;render()}else finish()};document.querySelector("#again").onclick=()=>show("setup");
</script></body></html>
