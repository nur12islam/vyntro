<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>VYNTRO • Leaderboard</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 50px}.top{display:flex;justify-content:space-between}.back{color:#aaa;text-decoration:none}.hero{text-align:center;padding:28px 0}.hero h1{font-size:38px;margin:5px 0}.muted{color:#888}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tabs button{padding:11px;border:1px solid #ffffff15;border-radius:13px;background:#ffffff08;color:#aaa}.tabs button.on{background:#fff;color:#111}.list{margin-top:14px;display:grid;gap:9px}.row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;padding:14px;border:1px solid #ffffff12;border-radius:18px;background:#ffffff07}.rank{text-align:center;font-size:22px;font-weight:900}.name{font-weight:800}.name small{display:block;color:#777;font-weight:500;margin-top:3px}.score{text-align:right;font-weight:900}.score small{display:block;color:#777;font-weight:500}.me{border-color:#fff4;background:#fff0a}.empty{text-align:center;color:#777;padding:30px}@media(max-width:500px){.tabs{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../">‹ VYNTRO</a><span class="muted">LEADERBOARD</span></div><section class="hero"><div>🏆</div><h1>VYNTRO Leaderboard</h1><p class="muted">Compete for XP, wins and bragging rights.</p></section><div class="tabs"><button data-period="all" class="on">All Time</button><button data-period="daily" class="">Daily</button><button data-period="weekly" class="">Weekly</button><button data-period="monthly" class="">Monthly</button></div><div id="list" class="list"><div class="empty">Loading…</div></div></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let current="all";async function load(){const box=document.querySelector("#list");try{const r=await fetch("/api/leaderboard?period="+current);const d=await r.json();if(!d.ok)throw new Error(d.error);if(!d.leaderboard.length){box.innerHTML='<div class="empty">No scores yet. Go play something! 🎮</div>';return}const me=tg?.initDataUnsafe?.user?.id;box.innerHTML=d.leaderboard.map(p=>{const name=[p.firstName,p.lastName].filter(Boolean).join(" ")||"Telegram Player";const handle=p.username?"@"+p.username:"";return '<div class="row '+(String(p.telegramId)===String(me)?"me":"")+'><div class="rank">'+(p.rank===1?"🥇":p.rank===2?"🥈":p.rank===3?"🥉":p.rank)+'</div><div class="name">'+name+'<small>'+handle+' · Level '+p.level+'</small></div><div class="score">'+p.score.toLocaleString()+' XP<small>'+p.gamesPlayed+' games</small></div></div>'}).join("")}catch(e){box.innerHTML='<div class="empty">⚠️ '+e.message+'</div>'}}document.querySelectorAll("[data-period]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-period]").forEach(x=>x.classList.remove("on"));b.classList.add("on");current=b.dataset.period;load()});load();</script></body></html>
