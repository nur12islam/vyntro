<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>VYNTRO • Tic-Tac-Toe</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#292929,transparent 36%),#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(470px,100%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{color:#aaa;text-decoration:none}.mode{display:flex;gap:8px}.mode button,.new{border:1px solid #ffffff18;border-radius:13px;background:#ffffff09;color:#fff;padding:9px 11px;font-weight:750}.mode .on{background:#fff;color:#111}.status{text-align:center;color:#aaa;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sq{aspect-ratio:1;border:1px solid #ffffff20;border-radius:22px;background:#ffffff08;color:#fff;font-size:clamp(48px,16vw,80px);font-weight:900}.sq.x{color:#fff}.sq.o{color:#8ee6ff}.new{display:block;width:100%;margin-top:14px;background:#eee;color:#111;border:0}.sub{text-align:center;color:#666;font-size:12px;margin-top:11px}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../../">‹ VYNTRO</a><div class="mode"><button id="cpu" class="on">🤖 CPU</button><button id="two">👥 2P</button></div></div><div class="status" id="status">Your turn · X</div><div class="grid" id="grid"></div><button class="new" id="new">↻ New Game</button><div class="sub">Simple rules. Fast rounds. First to three in a row.</div></main><script>
const grid=document.querySelector("#grid"),status=document.querySelector("#status");let b,turn,done,vs=true;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function reset(){vxEvent("play");b=Array(9).fill("");turn="X";done=false;render()}
function winner(){for(const w of wins)if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])return b[w[0]];return b.every(Boolean)?"draw":null}
function play(i){if(done||b[i]||turn!=="X"&&vs)return;b[i]=turn;const w=winner();if(w){done=true;if(w==="X")vxEvent("win");status.textContent=w==="draw"?"Draw 🤝":w+" wins 🎉";render();return}turn=turn==="X"?"O":"X";render();if(vs&&turn==="O")setTimeout(cpu,260)}
function cpu(){if(done)return;let choices=b.map((v,i)=>v?null:i).filter(i=>i!==null),pick=null;for(const p of ["O","X"]){for(const i of choices){b[i]=p;if(winner()===p)pick=i;b[i]="";if(pick!==null)break}}if(pick===null&&choices.includes(4))pick=4;if(pick===null)pick=choices[Math.floor(Math.random()*choices.length)];if(pick!==undefined)play(pick)}
function render(){grid.innerHTML=b.map((v,i)=>'<button class="sq '+(v?v.toLowerCase():'')+'">'+v+"</button>").join("");grid.querySelectorAll(".sq").forEach((e,i)=>e.onclick=()=>play(i));if(!done)status.textContent=vs?(turn==="X"?"Your turn · X":"CPU is thinking · O"):(turn+"'s turn")}
document.querySelector("#cpu").onclick=()=>{vs=true;document.querySelector("#cpu").classList.add("on");document.querySelector("#two").classList.remove("on");reset()};document.querySelector("#two").onclick=()=>{vs=false;document.querySelector("#two").classList.add("on");document.querySelector("#cpu").classList.remove("on");reset()};document.querySelector("#new").onclick=reset;reset();
</script></body></html>
