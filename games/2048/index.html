<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>VYNTRO • 2048</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#292929,transparent 38%),#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(430px,92vw);margin:auto}.top{gap:8px}.scores{flex:1;justify-content:flex-end}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{color:#aaa;text-decoration:none}.scores{display:flex;gap:7px}.pill{border:1px solid #ffffff18;background:#ffffff09;border-radius:14px;padding:8px 11px;font-size:12px}.board{width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;padding:8px;border:1px solid #ffffff20;border-radius:24px;background:#111;box-shadow:0 24px 80px #0009;touch-action:none}.cell{min-width:0;min-height:0;border-radius:15px;background:#ffffff0a;display:grid;place-items:center;font-size:clamp(24px,8vw,42px);font-weight:900}.cell.v2{background:#dfe6e9;color:#111}.cell.v4{background:#b2bec3;color:#111}.cell.v8{background:#ff9f43}.cell.v16{background:#ff6b6b}.cell.v32{background:#ee5253}.cell.v64{background:#c44569}.cell.v128{background:#feca57;color:#111}.cell.v256{background:#ff9f43}.cell.v512{background:#54a0ff}.cell.v1024{background:#5f27cd}.cell.v2048{background:#00d2d3;color:#111}.board-shell{width:100%;padding:0}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1;border:0;border-radius:15px;padding:13px;background:#eee;color:#111;font-weight:800}.help{text-align:center;color:#777;font-size:12px;margin-top:11px}</style></head><body><main class="wrap"><div class="top"><a class="back" href="../../">‹ VYNTRO</a><div class="scores"><div class="pill">Score <b id="score">0</b></div><div class="pill">Best <b id="best">0</b></div></div></div><div class="board-shell"><div id="board" class="board"></div></div><div class="actions"><button id="new">↻ New Game</button></div><div class="help">Swipe or use arrow keys • Reach 2048</div></main><script>
const board=document.querySelector("#board"),S="vyntro2048";let a,score=0,best=+localStorage[S]||0, sx,sy;
function fresh(){vxEvent("play");a=Array(16).fill(0);score=0;add();add();render()}
function add(){let z=a.map((v,i)=>v?null:i).filter(i=>i!==null);if(z.length)a[z[Math.floor(Math.random()*z.length)]]=Math.random()<.9?2:4}
function move(d){let old=a.join(),lines=[];for(let r=0;r<4;r++)lines.push(d<2?a.slice(r*4,r*4+4):(a.filter((_,i)=>i%4===r)));if(d===1||d===3)lines=lines.map(x=>x.reverse());let out=[];lines.forEach(line=>{line=line.filter(Boolean);for(let i=0;i<line.length-1;i++)if(line[i]===line[i+1]){line[i]*=2;score+=line[i];line.splice(i+1,1)}while(line.length<4)line.push(0);out.push(line)});if(d===1||d===3)out=out.map(x=>x.reverse());if(d<2){a=out.flat()}else{a=Array(16).fill(0);for(let r=0;r<4;r++)for(let c=0;c<4;c++)a[r*4+c]=out[c][r]}if(a.join()!==old){add();best=Math.max(best,score);localStorage[S]=best;render();if(!a.some((v,i)=>!v||[1,4].some(k=>i%4!==3&&a[i+k]===v)))setTimeout(()=>alert("No moves left!"),50)}}
function render(){board.innerHTML=a.map(v=>'<div class="cell '+(v?'v'+v:'')+'">'+(v||"")+"</div>").join("");document.querySelector("#score").textContent=score;document.querySelector("#best").textContent=best}
addEventListener("keydown",e=>{const m={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3};if(m[e.key]!==undefined){e.preventDefault();move(m[e.key])}});board.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});board.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx<0?0:1):(dy<0?2:3))},{passive:true});document.querySelector("#new").onclick=fresh;fresh();
</script></body></html>
