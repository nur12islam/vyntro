<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>VYNTRO • Snake</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#252525,transparent 35%),#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(520px,100%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{color:#aaa;text-decoration:none}.pill{border:1px solid #ffffff18;background:#ffffff09;backdrop-filter:blur(20px);border-radius:18px;padding:8px 12px;font-size:13px}.board{width:100%;aspect-ratio:1;border:1px solid #ffffff20;border-radius:24px;background:#0d0d0d;box-shadow:0 24px 80px #0009;display:block}.controls{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:17px;user-select:none}.joystick{width:150px;height:150px;border-radius:50%;position:relative;touch-action:none;background:radial-gradient(circle at 38% 32%,#ffffff1c,#ffffff08 42%,#0008 72%);border:1px solid #ffffff1c;box-shadow:inset 0 2px 8px #fff1,0 15px 35px #0009}.joystick:after{content:"";position:absolute;inset:18px;border:1px solid #ffffff0b;border-radius:50%}.stick{width:66px;height:66px;border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff6,#ffffff20 40%,#0009 100%);border:1px solid #ffffff30;box-shadow:0 8px 20px #0009,inset 0 2px 5px #fff3;transition:transform .06s linear}.stick:after{content:"";position:absolute;inset:17px;border-radius:50%;border:1px solid #ffffff15}.joystick.active .stick{box-shadow:0 4px 15px #000b,inset 0 2px 5px #fff4}.pause-row{display:flex;gap:10px}.pause-row button{width:72px;height:48px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff10;color:#fff;font-size:20px;font-weight:800;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.pause-row button:active{transform:scale(.94);background:#ffffff20}.help{text-align:center;color:#777;font-size:12px;margin-top:10px}@media(max-width:420px){.joystick{width:138px;height:138px}.stick{width:62px;height:62px}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="../../">‹ VYNTRO</a><div class="pill">🐍 Snake · <b id="score">0</b></div></div><canvas id="board" class="board"></canvas><div class="controls"><div class="joystick" id="joystick" aria-label="Virtual joystick"><div class="stick" id="stick"></div></div><div class="pause-row"><button id="pause" aria-label="Pause">⏸️</button><button id="restart" aria-label="New Game">⏯️</button></div></div><div class="help">Arrow keys / swipe / buttons • Eat the glow • Don't hit yourself</div></main>
<script>
const c=document.querySelector("#board"),x=c.getContext("2d"),N=20;let snake,food,dir,next,score,running,over,timer;const tg=window.Telegram?.WebApp;tg?.ready();async function vxEvent(type){if(!tg?.initData)return;fetch("/api/progression/event",{method:"POST",headers:{"Content-Type":"application/json","X-Telegram-Init-Data":tg.initData},body:JSON.stringify({type,game:"snake"})}).catch(()=>{});}
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();
function reset(){vxEvent("play");snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;running=true;over=false;place();document.querySelector("#score").textContent=0;clearInterval(timer);timer=setInterval(tick,180);document.querySelector("#pause").textContent="⏸️";draw()}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function setdir(d){if(d.x+dir.x===0&&d.y+dir.y===0)return;next=d}
function tick(){if(!running||over)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){over=true;vxEvent("snake_10");if(score>=25)vxEvent("snake_25");running=false;draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.querySelector("#score").textContent=score;place()}else snake.pop();draw()}
function draw(){const w=c.clientWidth,g=w/N;x.clearRect(0,0,w,w);x.fillStyle="#0b0b0b";x.fillRect(0,0,w,w);x.strokeStyle="#ffffff08";for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*g,0);x.lineTo(i*g,w);x.stroke();x.beginPath();x.moveTo(0,i*g);x.lineTo(w,i*g);x.stroke()}x.fillStyle="#ff4d67";x.beginPath();x.arc((food.x+.5)*g,(food.y+.5)*g,g*.3,0,Math.PI*2);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?"#70e1a2":"#fff";x.beginPath();x.roundRect(p.x*g+2,p.y*g+2,g-4,g-4,7);x.fill()});if(over){x.fillStyle="#000a";x.fillRect(0,0,w,w);x.fillStyle="#fff";x.textAlign="center";x.font="800 28px system-ui";x.fillText("Game Over",w/2,w/2);x.font="14px system-ui";x.fillText("Tap New to try again",w/2,w/2+28)}}
const keys={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}};addEventListener("keydown",e=>{if(keys[e.key]){e.preventDefault();setdir(keys[e.key])}});
const joy=document.querySelector("#joystick"),stick=document.querySelector("#stick");let joyActive=false;
function moveJoy(clientX,clientY){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=clientX-cx,dy=clientY-cy,max=r.width*.30,len=Math.hypot(dx,dy)||1,scale=Math.min(1,max/len),xv=dx*scale,yv=dy*scale;stick.style.transform=`translate(calc(-50% + ${xv}px),calc(-50% + ${yv}px))`;if(Math.hypot(dx,dy)>18){if(Math.abs(dx)>Math.abs(dy))setdir({x:Math.sign(dx),y:0});else setdir({x:0,y:Math.sign(dy)})}}
function resetJoy(){joyActive=false;joy.classList.remove("active");stick.style.transform="translate(-50%,-50%)"}
joy.addEventListener("pointerdown",e=>{joyActive=true;joy.classList.add("active");joy.setPointerCapture(e.pointerId);moveJoy(e.clientX,e.clientY);e.preventDefault()});joy.addEventListener("pointermove",e=>{if(joyActive)moveJoy(e.clientX,e.clientY)});joy.addEventListener("pointerup",resetJoy);joy.addEventListener("pointercancel",resetJoy);
document.querySelector("#pause").onclick=()=>{if(!over)running=!running;document.querySelector("#pause").textContent=running?"⏸️":"▶️"};document.querySelector("#restart").onclick=reset;let sx,sy;c.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;setdir(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)})},{passive:true});reset();
</script></body></html>
