<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>VYNTRO • Snake</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#252525,transparent 35%),#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;display:grid;place-items:center;padding:18px}.wrap{width:min(520px,100%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.back{color:#aaa;text-decoration:none}.pill,.panel{border:1px solid #ffffff18;background:#ffffff09;backdrop-filter:blur(20px);border-radius:18px}.pill{padding:8px 12px;font-size:13px}.board{width:100%;aspect-ratio:1;border:1px solid #ffffff20;border-radius:24px;background:#0d0d0d;box-shadow:0 24px 80px #0009;display:block}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.controls button,button{border:0;border-radius:15px;padding:13px;background:#eee;color:#111;font-weight:800}.help{text-align:center;color:#777;font-size:12px;margin-top:12px}@media(max-width:420px){.controls button{padding:11px 7px}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="../../">‹ VYNTRO</a><div class="pill">🐍 Snake · <b id="score">0</b></div></div><canvas id="board" class="board"></canvas><div class="controls"><button data-d="up">↑</button><button id="pause">Ⅱ</button><button data-d="down">↓</button><button data-d="left">←</button><button id="restart">↻ New</button><button data-d="right">→</button></div><div class="help">Arrow keys / swipe / buttons • Eat the glow • Don't hit yourself</div></main>
<script>
const c=document.querySelector("#board"),x=c.getContext("2d"),N=20;let snake,food,dir,next,score,running,over,timer;
function resize(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;running=true;over=false;place();document.querySelector("#score").textContent=0;clearInterval(timer);timer=setInterval(tick,115);draw()}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function setdir(d){if(d.x+dir.x===0&&d.y+dir.y===0)return;next=d}
function tick(){if(!running||over)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){over=true;running=false;draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.querySelector("#score").textContent=score;place()}else snake.pop();draw()}
function draw(){const w=c.clientWidth,g=w/N;x.clearRect(0,0,w,w);x.fillStyle="#0b0b0b";x.fillRect(0,0,w,w);x.strokeStyle="#ffffff08";for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*g,0);x.lineTo(i*g,w);x.stroke();x.beginPath();x.moveTo(0,i*g);x.lineTo(w,i*g);x.stroke()}x.fillStyle="#ff4d67";x.beginPath();x.arc((food.x+.5)*g,(food.y+.5)*g,g*.3,0,Math.PI*2);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?"#70e1a2":"#fff";x.beginPath();x.roundRect(p.x*g+2,p.y*g+2,g-4,g-4,7);x.fill()});if(over){x.fillStyle="#000a";x.fillRect(0,0,w,w);x.fillStyle="#fff";x.textAlign="center";x.font="800 28px system-ui";x.fillText("Game Over",w/2,w/2);x.font="14px system-ui";x.fillText("Tap New to try again",w/2,w/2+28)}}
addEventListener("keydown",e=>{const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};if(m[e.key]){e.preventDefault();setdir(m[e.key])}});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>setdir({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[b.dataset.d]));document.querySelector("#pause").onclick=()=>running=!running;document.querySelector("#restart").onclick=reset;let sx,sy;c.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;setdir(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)})},{passive:true});reset();
</script></body></html>
