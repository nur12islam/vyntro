<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VYNTRO Puzzles</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between}.back{color:#aaa;text-decoration:none}.hero{padding:25px 0}.hero h1{font-size:40px;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:18px;border:1px solid #ffffff18;border-radius:22px;background:#ffffff08}.muted{color:#999}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.cell{aspect-ratio:1;border-radius:14px;background:#ffffff0d;display:grid;place-items:center;font-size:25px;cursor:pointer}button,input{width:100%;padding:12px;border-radius:14px;border:1px solid #ffffff18;background:#ffffff0d;color:#fff}button{background:#fff;color:#111;font-weight:800}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><b>VYNTRO</b><a class="back" href="../">← Home</a></div><section class="hero"><div class="muted">MINI PUZZLES</div><h1>Small games. Big brain. 🧩</h1></section><div class="grid"><div class="card"><h2>🧠 Memory Match</h2><div id="memory" class="board"></div><p id="memScore" class="muted"></p><button onclick="memoryInit()">New Game</button></div><div class="card"><h2>⚡ Reaction Test</h2><div id="reaction" style="padding:45px 10px;text-align:center;border-radius:16px;background:#ffffff0d;margin:12px 0">Wait...</div><button onclick="reactionInit()">Start</button></div><div class="card"><h2>🔢 Number Rush</h2><p>Tap numbers 1–20 in order.</p><div id="numbers" class="board"></div><p id="numOut" class="muted"></p><button onclick="numberInit()">New Round</button></div><div class="card"><h2>🔤 Word Scramble</h2><h3 id="scramble"></h3><input id="answer" placeholder="Your answer"><p id="wordOut" class="muted"></p><button onclick="checkWord()">Check</button><button style="margin-top:8px" onclick="wordInit()">New Word</button></div></div></main><script>let mem=[],open=[],matches=0;function memoryInit(){let a=["🍎","🚀","🎸","🐱","🌙","⚡","🍕","👻"];mem=[...a,...a].sort(()=>Math.random()-.5);open=[];matches=0;drawMem();document.querySelector("#memScore").textContent="0 / 8"}function drawMem(){document.querySelector("#memory").innerHTML=mem.map((x,i)=>'<div class="cell" onclick="flip('+i+')">'+(open.includes(i)||mem[i]==="✓"?mem[i]:"❓")+"</div>").join("")}function flip(i){if(open.length===2||open.includes(i)||mem[i]==="✓")return;open.push(i);drawMem();if(open.length===2){let a=open[0],b=open[1];if(mem[a]===mem[b]){mem[a]=mem[b]="✓";matches++;document.querySelector("#memScore").textContent=matches+" / 8";open=[];drawMem()}else setTimeout(()=>{open=[];drawMem()},650)}}function reactionInit(){let el=document.querySelector("#reaction");el.textContent="Wait for it…";el.style.background="#ffffff0d";el.style.color="#fff";delete el.dataset.t;setTimeout(()=>{el.textContent="TAP!";el.style.background="#fff";el.style.color="#111";el.dataset.t=performance.now()},800+Math.random()*2800)}document.querySelector("#reaction").onclick=()=>{let el=document.querySelector("#reaction");if(el.dataset.t){document.querySelector("#numOut").textContent="Reaction: "+Math.round(performance.now()-el.dataset.t)+" ms";delete el.dataset.t}};let nums=[];function numberInit(){nums=[...Array(20)].map((_,i)=>i+1).sort(()=>Math.random()-.5);document.querySelector("#numbers").innerHTML=nums.map(n=>'<div class="cell" onclick="hitNum('+n+')">'+n+"</div>").join("");window.nextNum=1;document.querySelector("#numOut").textContent=""}function hitNum(n){if(n===window.nextNum){window.nextNum++;if(window.nextNum===21)document.querySelector("#numOut").textContent="🏁 Complete!"}}const words=["literature","galaxy","adventure","javascript","keyboard","phantom","butterfly","universe"];let current="";function wordInit(){current=words[Math.floor(Math.random()*words.length)];document.querySelector("#scramble").textContent=current.split("").sort(()=>Math.random()-.5).join("");document.querySelector("#answer").value="";document.querySelector("#wordOut").textContent=""}function checkWord(){document.querySelector("#wordOut").textContent=document.querySelector("#answer").value.trim().toLowerCase()===current?"✅ Correct!":"❌ Try again."}memoryInit();numberInit();wordInit();</script></body></html>
