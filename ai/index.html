<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>VYNTRO AI</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between}.back{color:#aaa;text-decoration:none}.hero{padding:30px 0}.hero h1{font-size:45px;margin:5px 0}.muted{color:#999}.box{padding:18px;border:1px solid #ffffff18;border-radius:24px;background:#ffffff09}textarea{width:100%;min-height:150px;resize:vertical;background:#ffffff08;color:#fff;border:1px solid #ffffff18;border-radius:16px;padding:14px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:850;margin-top:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{width:auto;margin:0;background:#ffffff0d;color:#fff;border:1px solid #ffffff18}.reply{white-space:pre-wrap;line-height:1.6;margin-top:16px;padding:16px;border-radius:16px;background:#0005;min-height:70px}</style></head><body><main><div class="top"><b>VYNTRO</b><a class="back" href="../">← Home</a></div><section class="hero"><div class="muted">YOUR VYNTRO COMPANION</div><h1>VYNTRO AI 🤖</h1><p class="muted">Ask, explore, get a challenge, pick a game or get help with a report.</p></section><div class="box"><div class="chips"><button class="chip" onclick="quick('I am bored. Suggest something fun inside VYNTRO.')">🎮 I'm bored</button><button class="chip" onclick="quick('Give me a difficult mini puzzle.')">🧩 Challenge me</button><button class="chip" onclick="quick('Quiz me on Shakespeare.')">🧠 Quiz me</button><button class="chip" onclick="quick('I have three friends. What party game should we play?')">🎉 Start a party</button><button class="chip" onclick="quick('Help me structure an academic report.')">📝 Help with report</button></div><textarea id="prompt" placeholder="Ask VYNTRO anything…"></textarea><button onclick="ask()">Ask VYNTRO AI</button><div id="reply" class="reply muted">Your response will appear here.</div></div></main><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();function quick(x){document.querySelector("#prompt").value=x;ask()}async function ask(){let p=document.querySelector("#prompt").value.trim();if(!p)return;document.querySelector("#reply").textContent="Thinking…";try{let r=await fetch("../api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p,telegramInitData:tg?.initData||""})});let d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||"AI request failed");document.querySelector("#reply").textContent=d.reply}catch(e){document.querySelector("#reply").textContent="⚠️ "+e.message}}</script></body></html>
